<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Buddy — on-screen reminder companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1F6; --panel:#FFFFFF; --panel2:#F4F8FB; --ink:#1C2733; --muted:#5E6D7C; --line:#D5E0E9;
  --accent:#2F7DE1; --sun:#FFCB2E; --coral:#E8473A; --mint:#1FA97F;
  --shadow:0 1px 0 rgba(28,39,51,.06);
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121920;--panel:#1B242E;--panel2:#222D38;--ink:#E7EEF4;--muted:#93A3B3;--line:#2E3B48;--accent:#5A9CF0;--shadow:none}
}
:root[data-theme="dark"]{--bg:#121920;--panel:#1B242E;--panel2:#222D38;--ink:#E7EEF4;--muted:#93A3B3;--line:#2E3B48;--accent:#5A9CF0;--shadow:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:800 26px/1 var(--display);padding:0 10px 18px}
.brand span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--ink);color:var(--panel)}
.rail .foot{margin-top:auto;font-size:13px;color:var(--muted);padding:10px}

main{padding:28px clamp(16px,4vw,44px) 220px;max-width:1100px;width:100%}
h1{font:800 clamp(30px,4vw,42px)/1.05 var(--display);margin:0 0 4px}
h2{font:700 22px/1.2 var(--display);margin:0 0 12px}
h3{font:700 16px/1.3 var(--body);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--coral)}
.btn.sm{padding:6px 10px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=time],input[type=date],select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--ink);font-weight:500;min-width:0}
input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px;cursor:pointer;flex:none}
input[type=range]{accent-color:var(--accent);width:100%}
code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}
.switch{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--mint)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* dashboard hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font:800 44px/1 var(--display);display:block}
.ring .lbl span{font-size:12.5px;color:var(--muted)}
.goal{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{font-weight:700}
.goal .n{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.facts div{font-size:13px;color:var(--muted)}
.facts b{display:block;font:700 24px/1.1 var(--display);color:var(--ink)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{font:700 16px/1 var(--display);white-space:nowrap}
.tl{font-size:13.5px}.tl .item{padding:8px 0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.done{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.tag.snoozed{background:color-mix(in srgb,var(--sun) 30%,transparent);color:#9a6b00}
.tag.missed{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}

.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form fieldset{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form legend{font-weight:700;font-size:13px;padding:0 6px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:grid;place-items:center;width:38px;height:34px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px;background:var(--panel2)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.rcard:first-child{border-top:0}
.rcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.off{opacity:.5}

.stage{border-radius:16px;min-height:340px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(var(--panel2) 72%,color-mix(in srgb,var(--accent) 14%,var(--panel2)) 72%)}
.stage svg{width:170px;height:auto}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.swatch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.controls{display:flex;flex-direction:column;gap:18px}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpi b{font:800 34px/1 var(--display);display:block}
.kpi span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;border-top:0}
td.num,th.num{text-align:right}

.settings{display:flex;flex-direction:column}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .d{font-size:13px;color:var(--muted)}
.set .ctl{flex:none;width:min(220px,45%)}
.set .ctl.auto{width:auto}
.cat{display:grid;grid-template-columns:56px 1fr 40px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}

/* ===== buddy overlay ===== */
#buddy{position:fixed;left:0;top:0;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#buddy.dragging{cursor:grabbing}
#buddy .sprite.flip{transform:scaleX(-1)}
#buddy svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
#buddy.hidden{display:none}
.walking .leg.l{animation:legA .5s ease-in-out infinite alternate}
.walking .leg.r{animation:legB .5s ease-in-out infinite alternate}
.walking .arm.r{animation:legA .5s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .25s ease-in-out infinite alternate}
.idle .bodyg{animation:breathe 2.4s ease-in-out infinite}
.alert .arm.r{animation:wave .45s ease-in-out infinite alternate}
.alert .bodyg{animation:hop .9s ease-in-out infinite}
.eyes{animation:blink 4.5s infinite}
@keyframes legA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes legB{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes breathe{50%{transform:translateY(-1.5px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
@keyframes wave{from{transform:rotate(-165deg)}to{transform:rotate(-125deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.bubble{position:fixed;z-index:51;width:min(310px,calc(100vw - 24px));text-align:center}
.bubble.hidden{display:none}
.bubble .say{font:800 25px/1.08 var(--display);color:var(--sun);-webkit-text-stroke:5px var(--coral);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.25);margin-bottom:10px}
.bubble .say .em{font-size:30px;-webkit-text-stroke:0}
.bubble .prog{display:inline-block;margin-bottom:8px;background:#fff;color:#1C2733;font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px}
.bubble .acts{display:flex;gap:8px;justify-content:center}
.bubble button{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:#fff;color:#1C2733;box-shadow:0 2px 0 rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.18)}
.bubble button.yes{background:#1C2733;color:#fff}
.bubble.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:40;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 4px;font-size:22px;white-space:nowrap}
  .rail .foot{display:none}
  .nav{white-space:nowrap}
  .g2,.g3,.hero{grid-template-columns:1fr}
  .form,.form fieldset{grid-template-columns:1fr}
  .rcard{grid-template-columns:auto 1fr}
  .rcard .acts{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion: reduce){
  .walking .leg,.walking .arm,.walking .bodyg,.idle .bodyg,.alert .bodyg,.alert .arm.r,.eyes{animation:none!important}
  .bubble.pop{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">👋 Desk<span>Buddy</span></div>
    <button class="nav" data-page="dashboard">🏠 Dashboard</button>
    <button class="nav" data-page="reminders">⏰ Reminders</button>
    <button class="nav" data-page="character">🧑 Character</button>
    <button class="nav" data-page="analytics">📊 Analytics</button>
    <button class="nav" data-page="settings">⚙️ Settings</button>
    <div class="foot">Your buddy walks along the bottom of the screen. Drag it anywhere; click it to see what's next.</div>
  </nav>
  <main id="page"></main>
</div>
<div id="buddy" aria-label="Reminder buddy" role="button" tabindex="0"><div class="sprite"></div></div>
<div class="bubble hidden" id="bubble" role="alertdialog" aria-live="assertive"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Everything the app knows about a reminder lives in DATA.
   No code path checks for a specific reminder or category.
   ========================================================= */
const KEY='deskbuddy-v2';
const uid=()=>Math.random().toString(36).slice(2,9);
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* Things the buddy can hold. Add a new prop here and it shows up everywhere. */
const PROPS={
  none:{n:'Nothing',svg:''},
  bottle:{n:'Bottle',svg:`<rect x="27" y="98" width="14" height="30" rx="4" fill="rgba(190,225,255,.75)" stroke="#9cc6ec" stroke-width="1.5"/><rect x="28" y="110" width="12" height="16" rx="3" fill="rgba(80,160,240,.55)"/><rect x="30" y="93" width="8" height="6" rx="1.5" fill="#E8473A"/>`},
  coffee:{n:'Coffee',svg:`<path d="M26 111 L42 111 L40 130 L28 130Z" fill="#fff" stroke="#c8cdd3" stroke-width="1.2"/><rect x="25" y="108" width="18" height="4" rx="2" fill="#5B4636"/><rect x="27" y="117" width="14" height="6" fill="#B07A4F"/>`},
  book:{n:'Book',svg:`<rect x="22" y="104" width="24" height="20" rx="2" fill="#E8473A"/><rect x="24" y="106" width="20" height="16" fill="#FFF8E7"/><path d="M34 106 V122" stroke="#E8473A" stroke-width="1.5"/>`},
  phone:{n:'Phone',svg:`<rect x="28" y="102" width="14" height="24" rx="3" fill="#1C2733"/><rect x="30" y="105" width="10" height="17" rx="1.5" fill="#7FB8F0"/>`},
  dumbbell:{n:'Dumbbell',svg:`<rect x="22" y="123" width="26" height="4" rx="2" fill="#666"/><rect x="17" y="116" width="8" height="18" rx="2" fill="#333"/><rect x="45" y="116" width="8" height="18" rx="2" fill="#333"/>`},
  pill:{n:'Pill box',svg:`<rect x="24" y="110" width="22" height="14" rx="4" fill="#fff" stroke="#c8cdd3"/><rect x="24" y="110" width="11" height="14" rx="4" fill="#8B5CF6"/>`}
};
const LOOKS={
  classic:{skin:'#E9B48A',hair:'#2B1B12',jacket:'#4E7FB8',shirt:'#5B6470',pants:'#3A3F47',shoes:'#F4F4F4',hairStyle:'spiky',hat:'none',glasses:false,item:'none'},
  sporty:{skin:'#C68A5E',hair:'#111111',jacket:'#E8473A',shirt:'#FFFFFF',pants:'#1E2A3A',shoes:'#FFCB2E',hairStyle:'short',hat:'cap',glasses:false,item:'none'},
  office:{skin:'#F1C9A5',hair:'#5A3A22',jacket:'#2F3E50',shirt:'#DCE8F2',pants:'#2B2F36',shoes:'#3B2A20',hairStyle:'long',hat:'none',glasses:true,item:'coffee'},
  cozy:{skin:'#8D5B3E',hair:'#1A1A1A',jacket:'#1FA97F',shirt:'#F3E7C9',pants:'#4B3B2F',shoes:'#E9E2D0',hairStyle:'bald',hat:'beanie',glasses:true,item:'book'}
};
/* Starter templates are suggestions only — the user edits or deletes them like any other reminder. */
const STARTERS=[
  {title:'Drink water',emoji:'💧',cat:'Health',message:'Hey, {name}! Did you drink water?',type:'interval',every:60,activeFrom:'08:00',activeTo:'22:00',goal:8,unit:'glasses',prop:'bottle',doneLabel:'Yes!'},
  {title:'Evening meeting',emoji:'📅',cat:'Work',message:'Hey, {name}! Your 7 PM meeting is starting.',type:'daily',time:'19:00',days:[1,2,3,4,5],goal:0,unit:'',prop:'phone',doneLabel:'Joining'},
  {title:'Stretch break',emoji:'🧘',cat:'Breaks',message:'Stand up and stretch, {name}!',type:'interval',every:45,activeFrom:'10:00',activeTo:'19:00',goal:6,unit:'stretches',prop:'none',doneLabel:'Done'},
  {title:'Eye break',emoji:'👀',cat:'Breaks',message:'Look 20 feet away for 20 seconds.',type:'interval',every:20,activeFrom:'09:00',activeTo:'19:00',goal:0,unit:'',prop:'none',doneLabel:'Done'},
  {title:'Read 10 pages',emoji:'📖',cat:'Personal',message:'{name}, reading time! {count}/{goal} {unit} today.',type:'daily',time:'21:30',days:[],goal:1,unit:'sessions',prop:'book',doneLabel:'Reading'},
  {title:'Take vitamins',emoji:'💊',cat:'Health',message:'Time for your vitamins, {name}.',type:'daily',time:'09:00',days:[],goal:1,unit:'doses',prop:'pill',doneLabel:'Taken'},
  {title:'Workout',emoji:'🏋️',cat:'Health',message:'Workout o\'clock, {name}!',type:'daily',time:'18:00',days:[1,3,5],goal:0,unit:'',prop:'dumbbell',doneLabel:"Let's go"}
];
const DEFAULT_CATS=[
  {id:uid(),name:'Health',emoji:'💚',color:'#1FA97F'},
  {id:uid(),name:'Work',emoji:'💼',color:'#F0A020'},
  {id:uid(),name:'Breaks',emoji:'☕',color:'#2F7DE1'},
  {id:uid(),name:'Personal',emoji:'✨',color:'#8B5CF6'}
];

function fromStarter(t,cats){
  let c=cats.find(x=>x.name===t.cat);
  if(!c){c={id:uid(),name:t.cat,emoji:'🏷️',color:'#64748B'};cats.push(c)}
  const r={id:uid(),enabled:true,every:60,activeFrom:'',activeTo:'',time:'09:00',days:[],date:'',...t,catId:c.id};
  delete r.cat;r.nextDue=computeNext(r,Date.now());return r;
}
function defaults(){
  const cats=DEFAULT_CATS.map(c=>({...c,id:uid()}));
  const rs=STARTERS.slice(0,3).map(t=>fromStarter(t,cats));
  rs[0].nextDue=Date.now()+20000;
  return {categories:cats,reminders:rs,log:seedLog(rs),char:{...LOOKS.classic},
    settings:{name:'there',size:120,speed:45,walk:true,show:true,sound:true,snooze:10,dnd:false,autoMiss:5,theme:''},
    page:'dashboard',goalView:null};
}
/* Sample history is generated from each reminder's own schedule — nothing reminder-specific. */
function seedLog(rs){
  const out=[],day=86400000,t0=dayStart(Date.now());
  for(let d=6;d>=1;d--){
    const base=t0-d*day,dow=new Date(base).getDay();
    rs.forEach(r=>{
      let times=[];
      if(r.type==='interval'){const a=hm(r.activeFrom||'09:00'),b=hm(r.activeTo||'21:00');for(let m=a+r.every;m<=b&&times.length<16;m+=r.every)times.push(m)}
      else if(r.type==='daily'&&(!r.days.length||r.days.includes(dow)))times.push(hm(r.time));
      times.forEach(m=>{const x=Math.random();out.push({rid:r.id,catId:r.catId,ts:base+m*60000+Math.floor(Math.random()*8)*60000,action:x<.7?'done':x<.87?'snoozed':'missed',rt:Math.round(5+Math.random()*90),sample:true})});
    });
  }
  return out;
}

/* ---------- scheduling ---------- */
const hm=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return a*60+b};
function at(d,mins){const x=new Date(d);x.setHours(Math.floor(mins/60),mins%60,0,0);return x}
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function fitWindow(r,t){
  if(!r.activeFrom||!r.activeTo)return t;
  const a=hm(r.activeFrom),b=hm(r.activeTo),m=t.getHours()*60+t.getMinutes();
  if(a<=b){if(m>=a&&m<=b)return t;const d=new Date(t);if(m>b)d.setDate(d.getDate()+1);return at(d,a)}
  if(m>=a||m<=b)return t;return at(t,a);
}
function computeNext(r,from){
  const f=new Date(from);
  if(r.type==='interval')return fitWindow(r,new Date(from+Math.max(1,+r.every||60)*60000)).getTime();
  if(r.type==='daily'){const mins=hm(r.time);
    for(let i=0;i<8;i++){const d=new Date(f);d.setDate(d.getDate()+i);const t=at(d,mins);
      if(t>f&&(!r.days.length||r.days.includes(t.getDay())))return t.getTime()}
    return null}
  if(r.type==='once'){if(!r.date)return null;const t=new Date(r.date+'T'+(r.time||'09:00'));return t>f?t.getTime():null}
  return null;
}

const goalReminders=()=>S.reminders.filter(r=>+r.goal>0);
function countToday(rid){const s=dayStart(Date.now());return S.log.filter(l=>l.rid===rid&&l.ts>=s&&l.action==='done').length}
function streakFor(r){
  const counts={};S.log.forEach(l=>{if(l.rid===r.id&&l.action==='done'){const d=dayStart(l.ts);counts[d]=(counts[d]||0)+1}});
  let d=dayStart(Date.now()),n=0;if((counts[d]||0)<r.goal)d-=86400000;
  while((counts[d]||0)>=r.goal){n++;d-=86400000}return n;
}

/* ---------- buddy movement ---------- */
const B={x:80,y:0,dir:1,mode:'walk',until:0,drag:null,moved:false};
const elB=document.getElementById('buddy'),sprite=elB.querySelector('.sprite'),bubble=document.getElementById('bubble');
const bw=()=>S.settings.size, bh=()=>S.settings.size*222/120;
function renderBuddy(){
  const r=alertState&&S.reminders.find(x=>x.id===alertState.id);
  sprite.innerHTML=charSVG(S.char,r?r.prop:null);
  elB.style.width=bw()+'px';elB.classList.toggle('hidden',!S.settings.show);
}
function setMode(m){B.mode=m;sprite.classList.remove('walking','idle','alert');sprite.classList.add(m==='walk'?'walking':m)}
function clampPos(){B.x=Math.max(0,Math.min(innerWidth-bw(),B.x));B.y=Math.max(0,Math.min(innerHeight-bh(),B.y))}
B.y=innerHeight-bh()-10;
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!B.drag&&!alertState){
    if(!S.settings.walk){if(B.mode!=='idle')setMode('idle')}
    else if(t>B.until){
      if(B.mode==='walk'){setMode('idle');B.until=t+1500+Math.random()*3500}
      else{setMode('walk');if(Math.random()<.4)B.dir*=-1;B.until=t+4000+Math.random()*7000}
    }
    if(B.mode==='walk'){B.x+=B.dir*S.settings.speed*dt;if(B.x<=0){B.x=0;B.dir=1}if(B.x>=innerWidth-bw()){B.x=innerWidth-bw();B.dir=-1}}
  }
  sprite.classList.toggle('flip',B.dir<0);clampPos();
  elB.style.transform=`translate(${B.x}px,${B.y}px)`;
  if(!bubble.classList.contains('hidden'))placeBubble();
  requestAnimationFrame(loop);
}
function placeBubble(){
  const w=bubble.offsetWidth,h=bubble.offsetHeight;
  let left=Math.max(12,Math.min(innerWidth-w-12,B.x+bw()/2-w/2));
  let top=B.y+bh()*0.08-h;if(top<10)top=B.y+bh()+6;
  bubble.style.left=left+'px';bubble.style.top=top+'px';
}
elB.addEventListener('pointerdown',e=>{B.drag={dx:e.clientX-B.x,dy:e.clientY-B.y,sx:e.clientX,sy:e.clientY};B.moved=false;elB.classList.add('dragging');elB.setPointerCapture(e.pointerId)});
elB.addEventListener('pointermove',e=>{if(!B.drag)return;if(Math.abs(e.clientX-B.drag.sx)+Math.abs(e.clientY-B.drag.sy)>4)B.moved=true;B.x=e.clientX-B.drag.dx;B.y=e.clientY-B.drag.dy;if(!alertState)setMode('idle')});
elB.addEventListener('pointerup',()=>{elB.classList.remove('dragging');const click=!B.moved;B.drag=null;if(click)peek()});
elB.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();peek()}});
addEventListener('resize',clampPos);

let peekTimer=null;
function peek(){
  if(alertState)return;
  const n=upcoming()[0];
  bubble.innerHTML=`<div class="say" style="font-size:21px">${n?`${n.emoji} ${esc(n.title)} in ${fmtIn(n.nextDue-Date.now())}`:'Nothing scheduled. Enjoy!'}</div>`;
  showBubble();clearTimeout(peekTimer);peekTimer=setTimeout(()=>{if(!alertState)bubble.classList.add('hidden')},2800);
}
function showBubble(){bubble.classList.remove('hidden','pop');void bubble.offsetWidth;bubble.classList.add('pop');placeBubble()}

/* ---------- reminder engine (generic) ---------- */
function upcoming(){return S.reminders.filter(r=>r.enabled&&r.nextDue).sort((a,b)=>a.nextDue-b.nextDue)}
function fire(r){
  if(!r)return;
  alertState={id:r.id,firedAt:Date.now()};
  renderBuddy();setMode('alert');
  const prog=+r.goal>0?`<div class="prog">${countToday(r.id)} / ${r.goal} ${esc(r.unit||'')} today</div>`:'';
  bubble.innerHTML=`<div class="say"><span class="em">${esc(r.emoji)}</span> ${esc(fill(r,r.message||r.title))}</div>${prog}
    <div class="acts"><button class="yes" id="bYes">${esc(r.doneLabel||'Done')}</button><button id="bLater">Remind me in ${S.settings.snooze} min</button></div>`;
  showBubble();
  document.getElementById('bYes').onclick=()=>respond('done');
  document.getElementById('bLater').onclick=()=>respond('snoozed');
  if(S.settings.sound)chime();
}
function respond(action){
  if(!alertState)return;
  const r=S.reminders.find(x=>x.id===alertState.id),now=Date.now();
  S.log.push({rid:alertState.id,catId:r?.catId,ts:now,action,rt:Math.round((now-alertState.firedAt)/1000)});
  if(r){if(action==='snoozed')r.nextDue=now+S.settings.snooze*60000;else{r.nextDue=computeNext(r,now);if(!r.nextDue&&r.type==='once')r.enabled=false}}
  alertState=null;bubble.classList.add('hidden');renderBuddy();setMode('walk');B.until=performance.now()+5000;
  S.log=S.log.filter(l=>l.ts>now-60*86400000);save();
  toast(action==='done'?'Logged ✓':action==='snoozed'?`Snoozed for ${S.settings.snooze} min`:'Marked as missed');render();
}
setInterval(()=>{
  const now=Date.now();
  if(alertState){if(now-alertState.firedAt>S.settings.autoMiss*60000)respond('missed')}
  else if(!S.settings.dnd){const due=upcoming().find(r=>r.nextDue<=now);if(due)fire(due)}
  document.querySelectorAll('[data-due]').forEach(el=>{const d=+el.dataset.due;el.textContent=d?fmtIn(d-now):'—'});
},1000);
let actx=null;
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [660,880].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;const t=actx.currentTime+i*.16;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.4)})}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtIn(ms){if(ms<=0)return 'now';const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return `${h}h ${m%60}m`;return Math.floor(h/24)+'d'}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function fmt12(t){const[h,m]=(t||'0:0').split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function describe(r){
  if(r.type==='interval')return `Every ${r.every} min${r.activeFrom?`, ${r.activeFrom}–${r.activeTo}`:''}`;
  if(r.type==='daily'){const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const d=!r.days.length||r.days.length===7?'every day':r.days.join()==='1,2,3,4,5'?'weekdays':r.days.map(x=>dn[x]).join(', ');return `${fmt12(r.time)}, ${d}`}

}

        <label class="f">Counted as<input type="text" name="unit" value="${esc(r.unit||'')}" placeholder="e.g. glasses, pages, sets"></label>
      </fieldset>
      <label class="f">Done button<input type="text" name="doneLabel" value="${esc(r.doneLabel)}"></label>
      <div class="full row"><button class="btn primary" data-act="saveR">${editing?'Save changes':'Add reminder'}</button>${editing?'<button class="btn" data-act="cancelR">Cancel</button>':''}</div>
    </form></section></div>`;
};

P.character=()=>{
  const c=S.char,sw=[['skin','Skin'],['hair','Hair'],['jacket','Jacket'],['shirt','Shirt'],['pants','Pants'],['shoes','Shoes']];
  const ch=(key,opts)=>`<div class="chips">${opts.map(([v,l])=>`<button class="chip" data-char="${key}" data-val="${v}" aria-pressed="${String(c[key])===String(v)}">${l}</button>`).join('')}</div>`;
  return `<h1>Your buddy</h1><p class="sub">Changes show up on the walking buddy right away. Each reminder can also pick what the buddy holds when it pops up.</p>
  <div class="grid g2">
    <div class="stage box" id="stage" style="padding:0">${charSVG(c)}</div>
    <div class="box controls">
      <div><h3>Start from a look</h3><div class="chips">${Object.keys(LOOKS).map(k=>`<button class="chip" data-look="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
      <div><h3>Colors</h3><div class="swatches">${sw.map(([k,l])=>`<label class="swatch">${l}<input type="color" data-color="${k}" value="${c[k]}"></label>`).join('')}</div></div>
      <div><h3>Hair</h3>${ch('hairStyle',[['spiky','Spiky'],['short','Short'],['long','Long'],['bald','None']])}</div>
      <div><h3>Hat</h3>${ch('hat',[['none','None'],['cap','Cap'],['beanie','Beanie']])}</div>
      <div><h3>Usually holding</h3>${ch('item',Object.entries(PROPS).map(([k,v])=>[k,v.n]))}</div>
      <div><h3>Glasses</h3>${ch('glasses',[['true','On'],['false','Off']])}</div>
    </div>
  </div>`;
};

P.analytics=()=>{
  const day=86400000,t0=dayStart(Date.now()),days=Array.from({length:7},(_,i)=>t0-(6-i)*day);
  const week=S.log.filter(l=>l.ts>=days[0]);
  const cats=[...S.categories,{id:null,name:'Other',color:'#94A3B8'}];
  const catKey=l=>S.categories.some(c=>c.id===l.catId)?l.catId:null;
  const byDay=days.map(d=>{const L=week.filter(l=>l.ts>=d&&l.ts<d+day&&l.action==='done');return cats.map(c=>L.filter(l=>catKey(l)===c.id).length)});
  const dn=week.filter(l=>l.action==='done').length,snz=week.filter(l=>l.action==='snoozed').length,ms=week.filter(l=>l.action==='missed').length;
  const rated=week.filter(l=>!l.manual),rate=rated.length?Math.round(rated.filter(l=>l.action==='done').length/rated.length*100):0;
  const rts=rated.filter(l=>l.action==='done'&&l.rt).map(l=>l.rt),avg=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):0;
  const hours=Array(24).fill(0);week.filter(l=>l.action==='done').forEach(l=>hours[new Date(l.ts).getHours()]++);
  const hasSample=S.log.some(l=>l.sample);
  const W=640,H=230,pad=28,col=(W-pad*2)/7,bwid=col*.55,max=Math.max(4,...byDay.map(a=>a.reduce((x,y)=>x+y,0)));
  const dlabel=d=>new Date(d).toLocaleDateString([],{weekday:'short'});
  let bars='';days.forEach((d,i)=>{let y=H-pad;const x=pad+col*i+(col-bwid)/2;
    cats.forEach((c,j)=>{const v=byDay[i][j];if(!v)return;const h=v/max*(H-pad*2);y-=h;bars+=`<rect x="${x}" y="${y}" width="${bwid}" height="${h}" fill="${c.color}" rx="3"><title>${esc(c.name)}: ${v}</title></rect>`});
    bars+=`<text x="${x+bwid/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${dlabel(d)}</text>`});
  const usedCats=cats.filter((c,j)=>byDay.some(a=>a[j]));
  // goal chart for whichever goal reminder is selected
  const goals=goalReminders();
  const g=goals.find(r=>r.id===S.goalView)||goals[0];
  let goalChart='<p class="sub" style="margin:0">Set a daily goal on any reminder to track it here.</p>';
  if(g){
    const vals=days.map(d=>S.log.filter(l=>l.rid===g.id&&l.ts>=d&&l.ts<d+day&&l.action==='done').length);
    const gm=Math.max(+g.goal+2,...vals),Y=v=>H-pad-v/gm*(H-pad*2),X=i=>pad+(W-pad*2)/6*i,c=catOf(g).color;
    goalChart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title)} per day against goal">
      <line x1="${pad}" x2="${W-pad}" y1="${Y(g.goal)}" y2="${Y(g.goal)}" stroke="var(--coral)" stroke-dasharray="6 6" stroke-width="2"/>
      <text x="${W-pad}" y="${Y(g.goal)-6}" text-anchor="end" font-size="12" fill="var(--coral)">goal ${g.goal}</text>
      <polyline points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linejoin="round"/>
      ${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="var(--panel)" stroke="${c}" stroke-width="3"><title>${v} ${esc(g.unit)}</title></circle><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${dlabel(days[i])}</text>`).join('')}
    </svg><p class="hint" style="margin:8px 0 0">Average ${(vals.reduce((a,b)=>a+b,0)/7).toFixed(1)} ${esc(g.unit)} a day · ${streakFor(g)}-day streak</p>`;
  }
  const rows=S.reminders.map(r=>{const L=week.filter(l=>l.rid===r.id&&!l.manual);const d=L.filter(l=>l.action==='done').length;
    return {r,d,s:L.filter(l=>l.action==='snoozed').length,m:L.filter(l=>l.action==='missed').length,p:L.length?Math.round(d/L.length*100):null}});
  const hmax=Math.max(1,...hours);
  return `<h1>Analytics</h1><p class="sub">The last 7 days.${hasSample?' Includes sample history so the charts have something to show.':''}</p>
  <div class="grid g3" style="margin-bottom:18px">
    <div class="box kpi"><b>${rate}%</b><span>of reminders completed when they popped up</span></div>
    <div class="box kpi"><b>${avg}s</b><span>average time to respond</span></div>
    <div class="box kpi"><b>${dn}</b><span>completed (${snz} snoozed, ${ms} missed)</span></div>
  </div>
  <div class="grid g2">
    <section class="box chart"><h2>Completed per day</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Completed reminders per day by category">${bars}</svg>
      <div class="legend">${usedCats.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join('')}</div></section>
    <section class="box chart"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Goal progress</h2>
      ${goals.length>1?`<select id="goalView" aria-label="Choose goal">${goals.map(r=>`<option value="${r.id}" ${r.id===g.id?'selected':''}>${esc(r.emoji+' '+r.title)}</option>`).join('')}</select>`:''}</div>${goalChart}</section>
  </div>
  <section class="box" style="margin-top:18px"><h2>By reminder</h2><div class="tbl"><table>
    <tr><th>Reminder</th><th class="num">Done</th><th class="num">Snoozed</th><th class="num">Missed</th><th class="num">Completion</th></tr>
    ${rows.map(x=>`<tr><td>${esc(x.r.emoji+' '+x.r.title)}</td><td class="num">${x.d}</td><td class="num">${x.s}</td><td class="num">${x.m}</td><td class="num">${x.p===null?'—':x.p+'%'}</td></tr>`).join('')}
  </table></div></section>
  <section class="box chart" style="margin-top:18px"><h2>When you respond</h2>
    <svg viewBox="0 0 ${W} 120" role="img" aria-label="Completions by hour of day">${hours.map((v,i)=>{const x=pad+(W-pad*2)/24*i,h=v/hmax*80;return `<rect x="${x}" y="${92-h}" width="${(W-pad*2)/24-4}" height="${h}" rx="2" fill="var(--accent)" opacity="${.25+.75*v/hmax}"/>${i%3===0?`<text x="${x+8}" y="112" font-size="11" text-anchor="middle" fill="var(--muted)">${(i%12)||12}${i<12?'a':'p'}</text>`:''}`}).join('')}</svg>
  </section>
  ${hasSample?'<div class="row" style="margin-top:16px"><button class="btn" data-act="clearSample">Remove sample history</button></div>':''}`;
};

P.settings=()=>{
  const s=S.settings,sw=k=>`<span class="switch"><input type="checkbox" data-set="${k}" ${s[k]?'checked':''}><span></span></span>`;
  return `<h1>Settings</h1><p class="sub">How your buddy behaves, and how reminders are grouped.</p>
  <div class="grid g2">
  <section class="box settings">
    <div class="set"><div><b>Your name</b><div class="d">Fills in <code>{name}</code> in messages</div></div><div class="ctl"><input type="text" data-set="name" value="${esc(s.name)}" style="width:100%"></div></div>
    <div class="set"><div><b>Show buddy</b><div class="d">Hide the character; reminders still run</div></div><div class="ctl auto">${sw('show')}</div></div>
    <div class="set"><div><b>Walk around</b><div class="d">Off keeps it where you put it</div></div><div class="ctl auto">${sw('walk')}</div></div>
    <div class="set"><div><b>Walking speed</b><div class="d">${s.speed} px per second</div></div><div class="ctl"><input type="range" min="10" max="140" data-set="speed" value="${s.speed}"></div></div>
    <div class="set"><div><b>Buddy size</b><div class="d">${s.size}px wide</div></div><div class="ctl"><input type="range" min="70" max="220" data-set="size" value="${s.size}"></div></div>
    <div class="set"><div><b>Sound</b><div class="d">Soft chime with each reminder</div></div><div class="ctl auto">${sw('sound')}</div></div>
    <div class="set"><div><b>Snooze length</b><div class="d">What “Remind me later” waits</div></div><div class="ctl"><select data-set="snooze" style="width:100%">${[5,10,15,30,60].map(m=>`<option ${s.snooze==m?'selected':''} value="${m}">${m} minutes</option>`).join('')}</select></div></div>
    <div class="set"><div><b>Mark as missed after</b><div class="d">If a pop-up sits unanswered</div></div><div class="ctl"><select data-set="autoMiss" style="width:100%">${[2,5,10,15].map(m=>`<option ${s.autoMiss==m?'selected':''} value="${m}">${m} minutes</option>`).join('')}</select></div></div>
    <div class="set"><div><b>Do not disturb</b><div class="d">Pause every reminder</div></div><div class="ctl auto">${sw('dnd')}</div></div>
    <div class="set"><div><b>Theme</b></div><div class="ctl"><select id="theme" style="width:100%"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div>
    <div class="set"><div><b>Start over</b><div class="d">Deletes reminders, history and your buddy's look</div></div><div class="ctl auto"><button class="btn danger" data-act="reset">Reset everything</button></div></div>
  </section>
  <section class="box"><h2>Categories</h2><p class="hint" style="margin:-4px 0 12px">Used for colors on the dashboard and charts.</p>
    <div>${S.categories.map(c=>{const used=S.reminders.filter(r=>r.catId===c.id).length;return `<div class="cat">
      <input type="text" data-cat="${c.id}" data-field="emoji" value="${esc(c.emoji)}" maxlength="4" aria-label="Icon" style="text-align:center">
      <input type="text" data-cat="${c.id}" data-field="name" value="${esc(c.name)}" aria-label="Name">
      <input type="color" data-cat="${c.id}" data-field="color" value="${c.color}" aria-label="Color">
      <button class="btn sm danger" data-delcat="${c.id}" ${S.categories.length<2?'disabled':''} title="${used?`Moves ${used} reminder(s) to the first category`:''}">Delete</button></div>`}).join('')}</div>
    <button class="btn" data-act="addCat" style="margin-top:12px">+ Add category</button>
  </section></div>`;
};

/* ---------- render & events ---------- */
const main=document.getElementById('page');
function render(){
  main.innerHTML=P[S.page]();
  document.querySelectorAll('.nav').forEach(n=>n.setAttribute('aria-current',n.dataset.page===S.page?'page':'false'));
  if(S.page==='reminders')syncType();
  const th=document.getElementById('theme');if(th)th.value=S.settings.theme||'';
}
function syncType(){const t=document.getElementById('rtype');if(!t)return;document.querySelectorAll('[data-show]').forEach(el=>el.style.display=el.dataset.show.split(' ').includes(t.value)?'':'none')}
function go(p){S.page=p;editing=null;save();render()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));

main.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go)go(d.go);
  if(d.plus){const r=S.reminders.find(x=>x.id===d.plus);S.log.push({rid:r.id,catId:r.catId,ts:Date.now(),action:'done',rt:0,manual:true});save();render();toast(`${r.emoji} +1 ${r.unit||''}`)}
  if(d.act==='test'){if(alertState)return;fire(upcoming()[0]||S.reminders[0])}
  if(d.fire){if(alertState)respond('missed');fire(S.reminders.find(x=>x.id===d.fire))}
  if(d.edit){editing={...S.reminders.find(x=>x.id===d.edit)};render()}
  if(d.del){S.reminders=S.reminders.filter(x=>x.id!==d.del);save();render();toast('Reminder deleted')}
  if(d.starter!==undefined){editing={...fromStarter(STARTERS[+d.starter],S.categories),_new:true};render();toast('Starter loaded — adjust and save')}
  if(d.act==='cancelR'){editing=null;render()}
  if(d.act==='saveR'){
    const f=document.getElementById('rform'),fd=new FormData(f),title=(fd.get('title')||'').trim();
    if(!title){f.title.focus();toast('Give the reminder a title');return}
    const isNew=!editing||editing._new;
    const r={...(editing||{id:uid(),enabled:true}),title,emoji:fd.get('emoji')||'⏰',message:fd.get('message')||title,catId:fd.get('catId'),prop:fd.get('prop'),type:fd.get('type'),
      every:Math.max(1,+fd.get('every')||60),activeFrom:fd.get('activeFrom'),activeTo:fd.get('activeTo'),time:fd.get('time')||'09:00',date:fd.get('date'),
      days:fd.getAll('days').map(Number),goal:Math.max(0,+fd.get('goal')||0),unit:(fd.get('unit')||'').trim(),doneLabel:fd.get('doneLabel')||'Done'};
    delete r._new;
    if(r.type==='once'&&!r.date){toast('Pick a date for a one-time reminder');return}
    r.nextDue=computeNext(r,Date.now());if(r.type==='once'&&!r.nextDue){toast('That time has already passed');return}
    if(isNew)S.reminders.push(r);else S.reminders=S.reminders.map(x=>x.id===r.id?r:x);
    editing=null;save();render();toast(isNew?`Added “${r.title}”`:'Changes saved');
  }
  if(d.look){S.char={...LOOKS[d.look]};save();renderBuddy();render()}
  if(d.char){S.char[d.char]=d.char==='glasses'?d.val==='true':d.val;save();renderBuddy();render()}
  if(d.act==='clearSample'){S.log=S.log.filter(l=>!l.sample);save();render();toast('Sample history removed')}
  if(d.act==='addCat'){S.categories.push({id:uid(),name:'New category',emoji:'🏷️',color:'#64748B'});save();render()}
  if(d.delcat){const first=S.categories.find(c=>c.id!==d.delcat);S.reminders.forEach(r=>{if(r.catId===d.delcat)r.catId=first.id});S.categories=S.categories.filter(c=>c.id!==d.delcat);save();render();toast('Category deleted')}
  if(d.act==='reset'){if(confirm('Delete all reminders, history and settings?')){try{localStorage.removeItem(KEY)}catch(e){}
    S=defaults();S.log=[];alertState=null;bubble.classList.add('hidden');delete document.documentElement.dataset.theme;save();renderBuddy();render();toast('Everything reset')}}
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.toggle){const r=S.reminders.find(x=>x.id===t.dataset.toggle);r.enabled=t.checked;if(r.enabled)r.nextDue=computeNext(r,Date.now());save();render()}
  if(t.id==='rtype')syncType();
  if(t.id==='goalView'){S.goalView=t.value;save();render()}
  if(t.id==='theme'){if(t.value)document.documentElement.dataset.theme=t.value;else delete document.documentElement.dataset.theme;S.settings.theme=t.value;save()}
  if(t.dataset.cat){const c=S.categories.find(x=>x.id===t.dataset.cat);c[t.dataset.field]=t.value||c[t.dataset.field];save();if(t.dataset.field!=='color')render()}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==='checkbox'?t.checked:(t.type==='range'||k==='snooze'||k==='autoMiss')?+t.value:t.value;
    if(k==='name'&&!t.value.trim())S.settings.name='there';save();renderBuddy();clampPos();render()}
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.color){S.char[t.dataset.color]=t.value;renderBuddy();const st=document.getElementById('stage');if(st)st.innerHTML=charSVG(S.char);save()}
  if(t.dataset.cat&&t.dataset.field==='color'){S.categories.find(x=>x.id===t.dataset.cat).color=t.value;save()}
  if(t.dataset.set&&t.type==='range'){S.settings[t.dataset.set]=+t.value;renderBuddy();clampPos();save();const dd=t.closest('.set').querySelector('.d');if(dd)dd.textContent=t.dataset.set==='speed'?`${t.value} px per second`:`${t.value}px wide`}
});

if(S.settings.theme)document.documentElement.dataset.theme=S.settings.theme;
renderBuddy();setMode('walk');B.until=performance.now()+6000;render();requestAnimationFrame(loop);
</script>
</body>
</html>
